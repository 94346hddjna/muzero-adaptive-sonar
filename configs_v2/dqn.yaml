# DQN配置（依据开题报告式(28)、第7章基线4）
dqn:
  hidden_dims: [256, 256]    # 输入=式(15)观测向量(2N+3)
  learning_rate: 3.0e-4
  batch_size: 128
  buffer_size: 200000        # 转移数回放
  target_update_steps: 2000  # 目标网络同步
  epsilon_start: 1.0
  epsilon_final: 0.05
  epsilon_decay_steps: 200000
  gamma: 0.99
  max_grad_norm: 5.0
  train_every_steps: 4
  warmup_steps: 5000
  weight_decay: 1.0e-4       # AdamW

smoke:
  dqn:
    batch_size: 32
    buffer_size: 10000
    epsilon_decay_steps: 1500
    target_update_steps: 500
    train_every_steps: 4
    warmup_steps: 200
